# ---------------------------------------------------------------
# HealthCare Insurance Portal - configuration
# Secrets are read from ENVIRONMENT VARIABLES (never hardcode them).
# ---------------------------------------------------------------
spring.application.name=health-insurance-portal
server.port=8080

# --- Database (set DB_USERNAME and DB_PASSWORD in your environment) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/health_insurance_portal?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# "none" = Hibernate never touches the schema.
# The schema is created by database/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Admin bootstrap (used once at startup if no admin exists) ---
app.admin.email=${ADMIN_EMAIL:admin@healthportal.local}
app.admin.password=${ADMIN_PASSWORD}

# --- Sessions / cookies ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Safe error messages (no stack traces sent to browser) ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
